<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AURIVO</title>
<style>
  body { font-family: system-ui, sans-serif; background:#0b0f14; color:#e6edf3; margin:0; padding:24px; }
  h1 { margin:0 0 16px; }
  .row { display:flex; gap:12px; align-items:center; margin:12px 0; }
  select,button,input { padding:8px 12px; border-radius:8px; border:1px solid #30363d; background:#161b22; color:#e6edf3; }
  button { cursor:pointer; }
  .meter { width:300px; height:12px; background:#21262d; border-radius:6px; overflow:hidden; }
  .bar { height:100%; width:0%; background:#2ea043; }
  .status { font-size:14px; color:#8b949e; }
</style>
</head>
<body>
  <h1>AURIVO</h1>
  <div class="status" id="status">Stopped</div>
  <div class="row">
    <label>Input</label>
    <select id="input"></select>
    <label>Output</label>
    <select id="output"></select>
  </div>
  <div class="row">
    <button id="start">Start</button>
    <button id="stop">Stop</button>
    <label>Gain dB</label>
    <input id="gain" type="range" min="-24" max="24" step="0.5" value="0" />
    <span id="gainval">0</span>
  </div>
   <div class="row">
     <label>Level</label>
     <div class="meter"><div class="bar" id="bar"></div></div>
     <span id="lvl">0.000</span>
   </div>
   <h2 style="font-size:16px;margin-top:24px;">Delay / Echo</h2>
   <div class="row"><label>Time</label><input id="dl_time" type="range" min="20" max="1200" step="10" value="300" /><span id="dl_timev">300 ms</span></div>
   <div class="row"><label>Feedback</label><input id="dl_fb" type="range" min="0" max="0.95" step="0.01" value="0.35" /><span id="dl_fbv">0.35</span></div>
   <div class="row"><label>Mix</label><input id="dl_mix" type="range" min="0" max="1" step="0.01" value="0.3" /><span id="dl_mixv">0.30</span></div>
   <div class="row"><label>Damp</label><input id="dl_damp" type="range" min="0" max="1" step="0.01" value="0.2" /><span id="dl_dampv">0.20</span></div>
   <h2 style="font-size:16px;margin-top:24px;">Reverb</h2>
   <div class="row"><label>Room</label><input id="rv_room" type="range" min="0" max="1" step="0.01" value="0.6" /><span id="rv_roomv">0.60</span></div>
   <div class="row"><label>Damp</label><input id="rv_damp" type="range" min="0" max="1" step="0.01" value="0.4" /><span id="rv_dampv">0.40</span></div>
   <div class="row"><label>Wet</label><input id="rv_wet" type="range" min="0" max="1" step="0.01" value="0.25" /><span id="rv_wetv">0.25</span></div>
   <div class="row"><label>Dry</label><input id="rv_dry" type="range" min="0" max="1" step="0.01" value="0.85" /><span id="rv_dryv">0.85</span></div>
   <h2 style="font-size:16px;margin-top:24px;">Vocal FX</h2>
   <div class="row"><label>Mode</label>
     <select id="vo_mode"><option value="0">Ring mod</option><option value="1">Robot</option><option value="2">Vowel formant</option><option value="3">Tremolo</option></select>
   </div>
   <div class="row"><label>Carrier</label><input id="vo_car" type="range" min="1" max="800" step="1" value="40" /><span id="vo_carv">40 Hz</span></div>
   <div class="row"><label>Vowel</label><input id="vo_vowel" type="range" min="0" max="4" step="0.01" value="0" /><span id="vo_vowelv">A</span></div>
   <div class="row"><label>Depth</label><input id="vo_depth" type="range" min="0" max="1" step="0.01" value="0.6" /><span id="vo_depthv">0.60</span></div>
   <div class="row"><label>Mix</label><input id="vo_mix" type="range" min="0" max="1" step="0.01" value="0.6" /><span id="vo_mixv">0.60</span></div>
   <script>
    const invoke = window.__TAURI__.core.invoke;
    async function refreshDevices() {
      const ins = await invoke('list_input_devices');
      const outs = await invoke('list_output_devices');
      const isel = document.getElementById('input');
      const osel = document.getElementById('output');
      isel.innerHTML = ins.map(d=>`<option>${d}</option>`).join('');
      osel.innerHTML = outs.map(d=>`<option>${d}</option>`).join('');
    }
    document.getElementById('start').onclick = async () => {
      await invoke('start_engine', { input: document.getElementById('input').value, output: document.getElementById('output').value });
      document.getElementById('status').textContent = 'Running';
    };
    document.getElementById('stop').onclick = async () => {
      await invoke('stop_engine');
      document.getElementById('status').textContent = 'Stopped';
    };
    document.getElementById('gain').oninput = async (e) => {
      const v = parseFloat(e.target.value);
      document.getElementById('gainval').textContent = v;
      await invoke('set_input_gain', { db: v });
    };
    setInterval(async () => {
      try {
        const l = await invoke('levels');
        const rms = l.rms || 0;
        document.getElementById('bar').style.width = Math.min(100, rms*200) + '%';
        document.getElementById('lvl').textContent = rms.toFixed(3);
      } catch(e) {}
    }, 100);
    let dl = [300, 0.35, 0.3, 0.2];
    function pushDelay() { invoke('set_delay', { time_ms: dl[0], feedback: dl[1], mix: dl[2], damp: dl[3] }); }
    [['time',0],['fb',1],['mix',2],['damp',3]].forEach(([key,i]) => {
      const el = document.getElementById('dl_' + key);
      el.oninput = (e) => {
        dl[i] = parseFloat(e.target.value);
        document.getElementById('dl_' + key + 'v').textContent = key === 'time' ? dl[i] + ' ms' : dl[i].toFixed(2);
        pushDelay();
      };
    });
    (async () => {
      dl = await invoke('get_delay');
      [['time',0],['fb',1],['mix',2],['damp',3]].forEach(([key,i]) => {
        const el = document.getElementById('dl_' + key);
        el.value = dl[i];
        document.getElementById('dl_' + key + 'v').textContent = key === 'time' ? dl[i] + ' ms' : dl[i].toFixed(2);
      });
    })();
    let rv = [0.6, 0.4, 0.25, 0.85];
    function pushReverb() { invoke('set_reverb', { room_size: rv[0], damp: rv[1], wet: rv[2], dry: rv[3] }); }
    [['room',0],['damp',1],['wet',2],['dry',3]].forEach(([key,i]) => {
      const el = document.getElementById('rv_' + key);
      el.oninput = (e) => {
        rv[i] = parseFloat(e.target.value);
        document.getElementById('rv_' + key + 'v').textContent = rv[i].toFixed(2);
        pushReverb();
      };
    });
    (async () => {
      rv = await invoke('get_reverb');
      [['room',0],['damp',1],['wet',2],['dry',3]].forEach(([key,i]) => {
        const el = document.getElementById('rv_' + key);
        el.value = rv[i];
        document.getElementById('rv_' + key + 'v').textContent = rv[i].toFixed(2);
      });
    })();
    let vo = [0, 40, 0, 0.6, 0.6];
    const vowels = ['A','E','I','O','U'];
    function pushVocal() { invoke('set_vocal', { mode: vo[0], carrier_hz: vo[1], vowel: vo[2], depth: vo[3], mix: vo[4] }); }
    const voMode = document.getElementById('vo_mode');
    voMode.onchange = (e) => { vo[0] = parseInt(e.target.value); pushVocal(); };
    const vowelFmt = (v) => vowels[Math.round(v)] || 'A';
    [['car',1,' Hz'],['vowel',2,'v'],['depth',3,''],['mix',4,'']].forEach(([key,i,suffix]) => {
      const el = document.getElementById('vo_' + key);
      el.oninput = (e) => {
        vo[i] = parseFloat(e.target.value);
        document.getElementById('vo_' + key + 'v').textContent = suffix === 'v' ? vowelFmt(vo[i]) : (suffix === ' Hz' ? vo[i] + ' Hz' : vo[i].toFixed(2));
        pushVocal();
      };
    });
    (async () => {
      vo = await invoke('get_vocal');
      voMode.value = vo[0];
      [['car',1,' Hz'],['vowel',2,'v'],['depth',3,''],['mix',4,'']].forEach(([key,i,suffix]) => {
        const el = document.getElementById('vo_' + key);
        el.value = vo[i];
        document.getElementById('vo_' + key + 'v').textContent = suffix === 'v' ? vowelFmt(vo[i]) : (suffix === ' Hz' ? vo[i] + ' Hz' : vo[i].toFixed(2));
      });
    })();
    refreshDevices();
  </script>
</body>
</html>
