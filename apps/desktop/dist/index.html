<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AURIVO</title>
<style>
  body { font-family: system-ui, sans-serif; background:#0b0f14; color:#e6edf3; margin:0; padding:24px; }
  h1 { margin:0 0 16px; }
  .row { display:flex; gap:12px; align-items:center; margin:12px 0; }
  select,button,input { padding:8px 12px; border-radius:8px; border:1px solid #30363d; background:#161b22; color:#e6edf3; }
  button { cursor:pointer; }
  .meter { width:300px; height:12px; background:#21262d; border-radius:6px; overflow:hidden; }
  .bar { height:100%; width:0%; background:#2ea043; }
  .status { font-size:14px; color:#8b949e; }
  canvas { width:100%; height:140px; background:#0d1117; border:1px solid #30363d; border-radius:8px; }
</style>
</head>
<body>
  <h1>AURIVO</h1>
  <div class="status" id="status">Stopped</div>
  <div class="row">
    <label>Input</label>
    <select id="input"></select>
    <label>Output</label>
    <select id="output"></select>
  </div>
  <div class="row">
    <button id="start">Start</button>
    <button id="stop">Stop</button>
    <label>Gain dB</label>
    <input id="gain" type="range" min="-24" max="24" step="0.5" value="0" />
    <span id="gainval">0</span>
  </div>
   <div class="row">
     <label>Level</label>
     <div class="meter"><div class="bar" id="bar"></div></div>
     <span id="lvl">0.000</span>
   </div>
   <h2 style="font-size:16px;margin-top:24px;">Spectrum</h2>
   <canvas id="spectrum" width="512" height="140"></canvas>
   <h2 style="font-size:16px;margin-top:24px;">Output</h2>
   <div class="row">
     <label>Out gain</label>
     <input id="out_gain" type="range" min="-24" max="24" step="0.5" value="0" />
     <span id="out_gainv">0 dB</span>
     <label><input id="out_mute" type="checkbox" /> Mute</label>
   </div>
   <h2 style="font-size:16px;margin-top:24px;">Recorder</h2>
   <div class="row">
     <button id="rec_start">Record</button>
     <button id="rec_stop">Stop</button>
     <span id="rec_state">Idle</span>
     <span id="rec_count">0 samples</span>
   </div>
   <div class="row">
     <label>Save as</label>
     <input id="rec_path" type="text" value="recording.wav" />
     <button id="rec_save">Save WAV</button>
   </div>
   <div class="row">
     <label>Play</label>
     <input id="play_path" type="text" value="recording.wav" />
     <button id="play_btn">Play</button>
     <button id="play_stop">Stop playback</button>
   </div>
   <h2 style="font-size:16px;margin-top:24px;">Delay / Echo</h2>
   <div class="row"><label>Time</label><input id="dl_time" type="range" min="20" max="1200" step="10" value="300" /><span id="dl_timev">300 ms</span></div>
   <div class="row"><label>Feedback</label><input id="dl_fb" type="range" min="0" max="0.95" step="0.01" value="0.35" /><span id="dl_fbv">0.35</span></div>
   <div class="row"><label>Mix</label><input id="dl_mix" type="range" min="0" max="1" step="0.01" value="0.3" /><span id="dl_mixv">0.30</span></div>
   <div class="row"><label>Damp</label><input id="dl_damp" type="range" min="0" max="1" step="0.01" value="0.2" /><span id="dl_dampv">0.20</span></div>
   <h2 style="font-size:16px;margin-top:24px;">Reverb</h2>
   <div class="row"><label>Room</label><input id="rv_room" type="range" min="0" max="1" step="0.01" value="0.6" /><span id="rv_roomv">0.60</span></div>
   <div class="row"><label>Damp</label><input id="rv_damp" type="range" min="0" max="1" step="0.01" value="0.4" /><span id="rv_dampv">0.40</span></div>
   <div class="row"><label>Wet</label><input id="rv_wet" type="range" min="0" max="1" step="0.01" value="0.25" /><span id="rv_wetv">0.25</span></div>
   <div class="row"><label>Dry</label><input id="rv_dry" type="range" min="0" max="1" step="0.01" value="0.85" /><span id="rv_dryv">0.85</span></div>
   <h2 style="font-size:16px;margin-top:24px;">Distortion</h2>
   <div class="row"><label>Mode</label>
     <select id="ds_mode"><option value="0">Soft (tanh)</option><option value="1">Hard clip</option><option value="2">Fuzz</option></select>
   </div>
   <div class="row"><label>Drive</label><input id="ds_drive" type="range" min="-12" max="48" step="1" value="12" /><span id="ds_drivev">12 dB</span></div>
   <div class="row"><label>Tone</label><input id="ds_tone" type="range" min="0" max="1" step="0.01" value="0.6" /><span id="ds_tonev">0.60</span></div>
   <div class="row"><label>Mix</label><input id="ds_mix" type="range" min="0" max="1" step="0.01" value="0.5" /><span id="ds_mixv">0.50</span></div>
   <div class="row"><label>Downsample</label><input id="ds_down" type="range" min="1" max="64" step="1" value="1" /><span id="ds_downv">1x</span></div>
   <div class="row"><label>Bit depth</label><input id="ds_bits" type="range" min="1" max="24" step="1" value="8" /><span id="ds_bitsv">8</span></div>
   <h2 style="font-size:16px;margin-top:24px;">Modulation</h2>
   <div class="row"><label>Mode</label>
     <select id="mo_mode"><option value="0">Chorus</option><option value="1">Flanger</option><option value="2">Phaser</option><option value="3">Vibrato</option></select>
   </div>
   <div class="row"><label>Rate</label><input id="mo_rate" type="range" min="0.1" max="12" step="0.1" value="1.5" /><span id="mo_ratev">1.5 Hz</span></div>
   <div class="row"><label>Depth</label><input id="mo_depth" type="range" min="0" max="1" step="0.01" value="0.4" /><span id="mo_depthv">0.40</span></div>
   <div class="row"><label>Feedback</label><input id="mo_fb" type="range" min="0" max="0.95" step="0.01" value="0.3" /><span id="mo_fbv">0.30</span></div>
   <div class="row"><label>Mix</label><input id="mo_mix" type="range" min="0" max="1" step="0.01" value="0.5" /><span id="mo_mixv">0.50</span></div>
   <h2 style="font-size:16px;margin-top:24px;">Parametric EQ</h2>
   <div id="eq"></div>
   <div class="row">
     <label>Pitch</label>
     <input id="pitch" type="range" min="-24" max="24" step="1" value="0" />
     <span id="pitchval">0 st</span>
   </div>
   <h2 style="font-size:16px;margin-top:24px;">Presets</h2>
   <div class="row"><label>Dir</label><input id="pr_dir" type="text" value="presets" /></div>
   <div class="row"><label>Name</label><input id="pr_name" type="text" value="My Voice" /><button id="pr_save">Save</button></div>
   <div class="row"><label>Saved</label><select id="pr_list"></select><button id="pr_load">Load</button><button id="pr_delete">Delete</button></div>
   <div class="row"><label>Params</label><span id="pr_info" class="status">—</span></div>
   <h2 style="font-size:16px;margin-top:24px;">Configuration</h2>
   <div class="row"><label>File</label><input id="cfg_path" type="text" value="aurivo-config.json" /></div>
   <div class="row"><button id="cfg_save">Save config</button><button id="cfg_load">Load config</button></div>
   <h2 style="font-size:16px;margin-top:24px;">Vocal FX</h2>
   <div class="row"><label>Mode</label>
     <select id="vo_mode"><option value="0">Ring mod</option><option value="1">Robot</option><option value="2">Vowel formant</option><option value="3">Tremolo</option></select>
   </div>
   <div class="row"><label>Carrier</label><input id="vo_car" type="range" min="1" max="800" step="1" value="40" /><span id="vo_carv">40 Hz</span></div>
   <div class="row"><label>Vowel</label><input id="vo_vowel" type="range" min="0" max="4" step="0.01" value="0" /><span id="vo_vowelv">A</span></div>
   <div class="row"><label>Depth</label><input id="vo_depth" type="range" min="0" max="1" step="0.01" value="0.6" /><span id="vo_depthv">0.60</span></div>
   <div class="row"><label>Mix</label><input id="vo_mix" type="range" min="0" max="1" step="0.01" value="0.6" /><span id="vo_mixv">0.60</span></div>
   <script>
    const invoke = window.__TAURI__.core.invoke;
    async function refreshDevices() {
      const ins = await invoke('list_input_devices');
      const outs = await invoke('list_output_devices');
      const isel = document.getElementById('input');
      const osel = document.getElementById('output');
      isel.innerHTML = ins.map(d=>`<option>${d}</option>`).join('');
      osel.innerHTML = outs.map(d=>`<option>${d}</option>`).join('');
    }
    document.getElementById('start').onclick = async () => {
      await invoke('start_engine', { input: document.getElementById('input').value, output: document.getElementById('output').value });
      document.getElementById('status').textContent = 'Running';
    };
    document.getElementById('stop').onclick = async () => {
      await invoke('stop_engine');
      document.getElementById('status').textContent = 'Stopped';
    };
    document.getElementById('gain').oninput = async (e) => {
      const v = parseFloat(e.target.value);
      document.getElementById('gainval').textContent = v;
      await invoke('set_input_gain', { db: v });
    };
    setInterval(async () => {
      try {
        const l = await invoke('levels');
        const rms = l.rms || 0;
        document.getElementById('bar').style.width = Math.min(100, rms*200) + '%';
        document.getElementById('lvl').textContent = rms.toFixed(3);
      } catch(e) {}
    }, 100);
    let dl = [300, 0.35, 0.3, 0.2];
    function pushDelay() { invoke('set_delay', { time_ms: dl[0], feedback: dl[1], mix: dl[2], damp: dl[3] }); }
    [['time',0],['fb',1],['mix',2],['damp',3]].forEach(([key,i]) => {
      const el = document.getElementById('dl_' + key);
      el.oninput = (e) => {
        dl[i] = parseFloat(e.target.value);
        document.getElementById('dl_' + key + 'v').textContent = key === 'time' ? dl[i] + ' ms' : dl[i].toFixed(2);
        pushDelay();
      };
    });
    (async () => {
      dl = await invoke('get_delay');
      [['time',0],['fb',1],['mix',2],['damp',3]].forEach(([key,i]) => {
        const el = document.getElementById('dl_' + key);
        el.value = dl[i];
        document.getElementById('dl_' + key + 'v').textContent = key === 'time' ? dl[i] + ' ms' : dl[i].toFixed(2);
      });
    })();
    let rv = [0.6, 0.4, 0.25, 0.85];
    function pushReverb() { invoke('set_reverb', { room_size: rv[0], damp: rv[1], wet: rv[2], dry: rv[3] }); }
    [['room',0],['damp',1],['wet',2],['dry',3]].forEach(([key,i]) => {
      const el = document.getElementById('rv_' + key);
      el.oninput = (e) => {
        rv[i] = parseFloat(e.target.value);
        document.getElementById('rv_' + key + 'v').textContent = rv[i].toFixed(2);
        pushReverb();
      };
    });
    (async () => {
      rv = await invoke('get_reverb');
      [['room',0],['damp',1],['wet',2],['dry',3]].forEach(([key,i]) => {
        const el = document.getElementById('rv_' + key);
        el.value = rv[i];
        document.getElementById('rv_' + key + 'v').textContent = rv[i].toFixed(2);
      });
    })();
    let ds = [0, 12, 0.6, 0.5, 1, 8];
    function pushDist() { invoke('set_distortion', { mode: ds[0], drive_db: ds[1], tone: ds[2], mix: ds[3], downsample: ds[4], bit_depth: ds[5] }); }
    const dsMode = document.getElementById('ds_mode');
    dsMode.onchange = (e) => { ds[0] = parseInt(e.target.value); pushDist(); };
    const distFmt = (key, v) => key === 'drive' ? v + ' dB' : (key === 'down' ? v + 'x' : (key === 'bits' ? String(v) : v.toFixed(2)));
    [['drive',1],['tone',2],['mix',3],['down',4],['bits',5]].forEach(([key,i]) => {
      const el = document.getElementById('ds_' + key);
      el.oninput = (e) => {
        ds[i] = parseFloat(e.target.value);
        document.getElementById('ds_' + key + 'v').textContent = distFmt(key, ds[i]);
        pushDist();
      };
    });
    (async () => {
      ds = await invoke('get_distortion');
      dsMode.value = ds[0];
      [['drive',1],['tone',2],['mix',3],['down',4],['bits',5]].forEach(([key,i]) => {
        const el = document.getElementById('ds_' + key);
        el.value = ds[i];
        document.getElementById('ds_' + key + 'v').textContent = distFmt(key, ds[i]);
      });
    })();
    let mo = [0, 1.5, 0.4, 0.3, 0.5];
    function pushMod() { invoke('set_modulation', { mode: mo[0], rate_hz: mo[1], depth: mo[2], feedback: mo[3], mix: mo[4] }); }
    const moMode = document.getElementById('mo_mode');
    moMode.onchange = (e) => { mo[0] = parseInt(e.target.value); pushMod(); };
    [['rate',1,' Hz'],['depth',2,''],['fb',3,''],['mix',4,'']].forEach(([key,i,suffix]) => {
      const el = document.getElementById('mo_' + key);
      el.oninput = (e) => {
        mo[i] = parseFloat(e.target.value);
        document.getElementById('mo_' + key + 'v').textContent = (suffix === ' Hz' ? mo[i].toFixed(1) + ' Hz' : mo[i].toFixed(2));
        pushMod();
      };
    });
    (async () => {
      mo = await invoke('get_modulation');
      moMode.value = mo[0];
      [['rate',1,' Hz'],['depth',2,''],['fb',3,''],['mix',4,'']].forEach(([key,i,suffix]) => {
        const el = document.getElementById('mo_' + key);
        el.value = mo[i];
        document.getElementById('mo_' + key + 'v').textContent = (suffix === ' Hz' ? mo[i].toFixed(1) + ' Hz' : mo[i].toFixed(2));
      });
    })();
    async function loadEq() {
      const bands = await invoke('get_eq_bands');
      const box = document.getElementById('eq');
      box.innerHTML = '';
      const kinds = ['Peaking','Low Shelf','High Shelf','Low Pass','High Pass'];
      bands.forEach((b, i) => {
        const state = Object.assign({}, b);
        const row = document.createElement('div');
        row.className = 'row';
        row.style.flexWrap = 'wrap';

        const title = document.createElement('span');
        title.style.width = '70px';
        title.textContent = 'Band ' + (i + 1);

        const kindSel = document.createElement('select');
        kinds.forEach((k, ki) => {
          const o = document.createElement('option');
          o.value = String(ki);
          o.textContent = k;
          if (ki === b.kind) o.selected = true;
          kindSel.appendChild(o);
        });
        kindSel.onchange = () => { state.kind = parseInt(kindSel.value); pushBand(); };

        function slider(min, max, step, key, fmt) {
          const wrap = document.createElement('span');
          wrap.style.display = 'inline-flex';
          wrap.style.alignItems = 'center';
          wrap.style.gap = '4px';
          const input = document.createElement('input');
          input.type = 'range';
          input.min = min; input.max = max; input.step = step;
          input.value = state[key];
          const span = document.createElement('span');
          span.textContent = fmt(state[key]);
          input.oninput = () => {
            state[key] = parseFloat(input.value);
            span.textContent = fmt(state[key]);
            pushBand();
          };
          wrap.append(input, span);
          return wrap;
        }

        const freqEl = slider(20, 18000, 1, 'frequency', v => v.toFixed(0) + ' Hz');
        const qEl = slider(0.1, 18, 0.1, 'q', v => v.toFixed(2));
        const gainEl = slider(-18, 18, 0.5, 'gain_db', v => v.toFixed(1) + ' dB');

        const en = document.createElement('input');
        en.type = 'checkbox';
        en.checked = state.enabled;
        en.title = 'Enabled';
        en.onchange = () => { state.enabled = en.checked; pushBand(); };

        const del = document.createElement('button');
        del.textContent = '\u00d7';
        del.title = 'Remove band';
        del.onclick = async () => {
          await invoke('remove_eq_band', { index: i });
          await loadEq();
        };

        function pushBand() {
          invoke('set_eq_band', {
            index: i, kind: state.kind, frequency: state.frequency,
            q: state.q, gain_db: state.gain_db, enabled: state.enabled
          });
        }

        row.append(title, kindSel, freqEl, qEl, gainEl, en, del);
        box.appendChild(row);
      });

      const addRow = document.createElement('div');
      addRow.className = 'row';
      const addBtn = document.createElement('button');
      addBtn.textContent = '+ Add band';
      addBtn.onclick = async () => {
        await invoke('add_eq_band', { kind: 0, frequency: 1000, q: 1.0, gain_db: 0 });
        await loadEq();
      };
      addRow.appendChild(addBtn);
      box.appendChild(addRow);
    }

    const pitch = document.getElementById('pitch');
    pitch.oninput = async (e) => {
      const v = parseFloat(e.target.value);
      document.getElementById('pitchval').textContent = v + ' st';
      await invoke('set_pitch', { semitones: v });
    };
    (async () => {
      const v = await invoke('get_pitch');
      pitch.value = v;
      document.getElementById('pitchval').textContent = v + ' st';
    })();
    const outGain = document.getElementById('out_gain');
    outGain.oninput = async (e) => {
      const v = parseFloat(e.target.value);
      document.getElementById('out_gainv').textContent = v + ' dB';
      await invoke('set_output_gain', { db: v });
    };
    document.getElementById('out_mute').onchange = async (e) => {
      await invoke('set_output_muted', { muted: e.target.checked });
    };
    (async () => {
      const db = await invoke('get_output_gain');
      outGain.value = db;
      document.getElementById('out_gainv').textContent = db.toFixed(1) + ' dB';
      document.getElementById('out_mute').checked = await invoke('is_output_muted');
    })();
    const canvas = document.getElementById('spectrum');
    const ctx = canvas.getContext('2d');
    async function drawSpectrum() {
      try {
        const bins = await invoke('spectrum');
        ctx.clearRect(0,0,canvas.width,canvas.height);
        if (bins.length) {
          const bw = canvas.width / bins.length;
          for (let i=0;i<bins.length;i++) {
            const db = bins[i];
            const h = Math.max(0, Math.min(1, (db + 90) / 90)) * canvas.height;
            ctx.fillStyle = '#2ea043';
            ctx.fillRect(i*bw, canvas.height-h, Math.max(1,bw), h);
          }
        }
      } catch(e) {}
      requestAnimationFrame(drawSpectrum);
    }
    drawSpectrum();
    document.getElementById('rec_start').onclick = async () => { await invoke('start_recording'); };
    document.getElementById('rec_stop').onclick = async () => { await invoke('stop_recording'); };
    document.getElementById('rec_save').onclick = async () => {
      try { await invoke('save_recording', { path: document.getElementById('rec_path').value }); }
      catch(e) { alert('Save failed: ' + e); }
    };
    document.getElementById('play_btn').onclick = async () => {
      try { await invoke('play_wav', { path: document.getElementById('play_path').value }); }
      catch(e) { alert('Playback failed: ' + e); }
    };
    document.getElementById('play_stop').onclick = async () => { await invoke('stop_playback'); };
    setInterval(async () => {
      try {
        const rec = await invoke('is_recording');
        const n = await invoke('recorded_samples');
        document.getElementById('rec_state').textContent = rec ? 'Recording' : 'Idle';
        document.getElementById('rec_count').textContent = n + ' samples';
      } catch(e) {}
    }, 250);
    const prDir = () => document.getElementById('pr_dir').value;
    function collectPresetParams() {
      return {
        gain_db: parseFloat(document.getElementById('gain').value) || 0,
        vocal_mode: vo[0],
        vocal_carrier_hz: vo[1],
        vocal_vowel: vo[2],
        vocal_depth: vo[3],
        vocal_mix: vo[4],
      };
    }
    async function refreshPresets() {
      try {
        const names = await invoke('list_presets', { dir: prDir() });
        document.getElementById('pr_list').innerHTML = names.map(n=>`<option>${n}</option>`).join('');
      } catch(e) {}
    }
    document.getElementById('pr_save').onclick = async () => {
      try {
        await invoke('save_preset', { dir: prDir(), name: document.getElementById('pr_name').value, params: collectPresetParams() });
        refreshPresets();
      } catch(e) { alert('Save failed: ' + e); }
    };
    document.getElementById('pr_load').onclick = async () => {
      const name = document.getElementById('pr_list').value;
      if (!name) return;
      try {
        const p = await invoke('load_preset', { dir: prDir(), name });
        document.getElementById('pr_info').textContent = JSON.stringify(p.params);
        await invoke('apply_preset', { params: p.params });
        if (typeof p.params.gain_db === 'number') {
          const g = document.getElementById('gain');
          g.value = p.params.gain_db;
          document.getElementById('gainval').textContent = p.params.gain_db;
        }
        const map = { mode: 'vocal_mode', car: 'vocal_carrier_hz', vowel: 'vocal_vowel', depth: 'vocal_depth', mix: 'vocal_mix' };
        Object.entries(map).forEach(([key, pk]) => {
          if (typeof p.params[pk] === 'number') {
            const idx = { mode: 0, car: 1, vowel: 2, depth: 3, mix: 4 }[key];
            vo[idx] = p.params[pk];
          }
        });
        syncVocalUI();
      } catch(e) { alert('Load failed: ' + e); }
    };
    document.getElementById('pr_delete').onclick = async () => {
      const name = document.getElementById('pr_list').value;
      if (!name) return;
      try { await invoke('delete_preset', { dir: prDir(), name }); refreshPresets(); }
      catch(e) { alert('Delete failed: ' + e); }
    };
    refreshPresets();
    document.getElementById('cfg_save').onclick = async () => {
      const cfg = {
        input_device: document.getElementById('input').value,
        output_device: document.getElementById('output').value,
        params: { gain_db: parseFloat(document.getElementById('gain').value) || 0 }
      };
      try { await invoke('save_config', { path: document.getElementById('cfg_path').value, cfg }); }
      catch(e) { alert('Save config failed: ' + e); }
    };
    document.getElementById('cfg_load').onclick = async () => {
      try {
        const cfg = await invoke('load_config', { path: document.getElementById('cfg_path').value });
        if (cfg.input_device) document.getElementById('input').value = cfg.input_device;
        if (cfg.output_device) document.getElementById('output').value = cfg.output_device;
        if (typeof cfg.params.gain_db === 'number') {
          document.getElementById('gain').value = cfg.params.gain_db;
          document.getElementById('gainval').textContent = cfg.params.gain_db;
          await invoke('set_input_gain', { db: cfg.params.gain_db });
        }
      } catch(e) { alert('Load config failed: ' + e); }
    };
    let vo = [0, 40, 0, 0.6, 0.6];
    const vowels = ['A','E','I','O','U'];
    function pushVocal() { invoke('set_vocal', { mode: vo[0], carrier_hz: vo[1], vowel: vo[2], depth: vo[3], mix: vo[4] }); }
    const voMode = document.getElementById('vo_mode');
    voMode.onchange = (e) => { vo[0] = parseInt(e.target.value); pushVocal(); };
    const vowelFmt = (v) => vowels[Math.round(v)] || 'A';
    function syncVocalUI() {
      voMode.value = vo[0];
      [['car',1,' Hz'],['vowel',2,'v'],['depth',3,''],['mix',4,'']].forEach(([key,i,suffix]) => {
        const el = document.getElementById('vo_' + key);
        el.value = vo[i];
        document.getElementById('vo_' + key + 'v').textContent = suffix === 'v' ? vowelFmt(vo[i]) : (suffix === ' Hz' ? vo[i] + ' Hz' : vo[i].toFixed(2));
      });
    }
    [['car',1,' Hz'],['vowel',2,'v'],['depth',3,''],['mix',4,'']].forEach(([key,i,suffix]) => {
      const el = document.getElementById('vo_' + key);
      el.oninput = (e) => {
        vo[i] = parseFloat(e.target.value);
        document.getElementById('vo_' + key + 'v').textContent = suffix === 'v' ? vowelFmt(vo[i]) : (suffix === ' Hz' ? vo[i] + ' Hz' : vo[i].toFixed(2));
        pushVocal();
      };
    });
    (async () => {
      vo = await invoke('get_vocal');
      voMode.value = vo[0];
      [['car',1,' Hz'],['vowel',2,'v'],['depth',3,''],['mix',4,'']].forEach(([key,i,suffix]) => {
        const el = document.getElementById('vo_' + key);
        el.value = vo[i];
        document.getElementById('vo_' + key + 'v').textContent = suffix === 'v' ? vowelFmt(vo[i]) : (suffix === ' Hz' ? vo[i] + ' Hz' : vo[i].toFixed(2));
      });
    })();
    refreshDevices();
    loadEq();
  </script>
</body>
</html>
