name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: ''
          - os: ubuntu-latest
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux audio/webkit dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build release bundles
        run: cargo build -p aurivo-desktop --release
      - name: Collect Windows artifacts
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item "target\release\aurivo-desktop.exe" artifacts\
          Get-ChildItem "target\release\bundle" -Recurse -File -ErrorAction SilentlyContinue | Copy-Item -Destination artifacts\
      - name: Collect macOS artifacts
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          cp -R target/release/bundle/* artifacts/ 2>/dev/null || true
      - name: Collect Linux artifacts
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts
          cp -R target/release/bundle/* artifacts/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: aurivo-${{ runner.os }}
          path: artifacts

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/**/*
          generate_release_notes: true
