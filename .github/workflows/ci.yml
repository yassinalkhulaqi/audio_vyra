name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (libraries)
        run: cargo clippy -p aurivo-core -p aurivo-dsp -p aurivo-audio-engine --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p aurivo-core -p aurivo-dsp -p aurivo-audio-engine
      - name: Build libraries
        run: cargo build -p aurivo-core -p aurivo-dsp -p aurivo-audio-engine --release
