name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  libraries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install audio dev libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p aurivo-core -p aurivo-dsp -p aurivo-audio-engine --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p aurivo-core -p aurivo-dsp -p aurivo-audio-engine
      - name: Build libraries
        run: cargo build -p aurivo-core -p aurivo-dsp -p aurivo-audio-engine --release

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check desktop crate
        run: cargo check -p aurivo-desktop --all-targets
      - name: Test desktop crate
        run: cargo test -p aurivo-desktop
